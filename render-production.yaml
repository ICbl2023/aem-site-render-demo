# Production AEM — service Node + disque persistant (payant).
# Un seul service sert les pages ET l’API (même origine) : /ants.html, /permis.html, /admin.html.
# Les fronts Netlify séparés ne suffisent pas : brouillons, uploads, envoi et admin exigent ce backend.
#
# À créer dans le tableau de bord Render (Blueprint ou Web Service) depuis un dépôt privé.
# Secrets à saisir manuellement (sync: false) — ne jamais les committer.
services:
  - type: web
    name: aem-questionnaires
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    disk:
      name: aem-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # RENDER_EXTERNAL_URL est fourni par Render ; server-config.js l'utilise comme AEM_ORIGIN si AEM_ORIGIN est vide.
      - key: AEM_RECEIPT_DIR
        value: /var/data/aem-receipts
      - key: AEM_DATA_DIR
        value: /var/data/aem-dossiers
      - key: AEM_DRAFT_DIR
        value: /var/data/aem-brouillons
      - key: AEM_DRAFTS
        value: "1"
      - key: AEM_BLOB_DRIVER
        value: "r2"
      - key: AEM_R2_PREFIX
        value: "aem"
      - key: AEM_R2_REGION
        value: "auto"
      - key: AEM_R2_ENDPOINT
        sync: false
      - key: AEM_R2_ACCESS_KEY_ID
        sync: false
      - key: AEM_R2_SECRET_ACCESS_KEY
        sync: false
      - key: AEM_R2_BUCKET
        sync: false
      - key: AEM_MAIL_ATTACHMENTS
        value: "0"
      - key: AEM_CANDIDATE_MAIL
        value: "1"
      - key: AEM_RETENTION_DAYS
        value: "0"
      - key: SMTP_PORT
        value: "587"
      # Format exact attendu par admin-auth.js : identifiant:motdepasse:role
      - key: AEM_ADMIN_ACCOUNTS
        sync: false
      # Laisser vide en production reelle (sinon l'ecran de connexion est prerempli).
      - key: AEM_ADMIN_PREFILL
        sync: false
      - key: AEM_FROM
        sync: false
      - key: AEM_RECIPIENT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: AEM_ADMIN_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
