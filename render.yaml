# Démo gratuite Render (Blueprint) : serveur complet, s'endort après ~15 min sans visite,
# disque éphémère (dossiers et brouillons disparaissent à chaque redéploiement / nouvelle instance).
# Pour la production payante + disque : render-production.yaml (ne PAS activer sans décision humaine).
# Origine publique : RENDER_EXTERNAL_URL (lue par server-config.js si AEM_ORIGIN est vide).
# Après création du service, saisir dans le dashboard :
#   AEM_ADMIN_ACCOUNTS=demo:demo:responsable
# Laisser AEM_ADMIN_PREFILL vide (sinon le mot de passe est exposé via /api/admin/session).
services:
  - type: web
    name: aem-site-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev && mkdir -p livraison && git archive --format=zip --prefix=aem-site/ -o livraison/aem-site-complet-actuel.zip HEAD
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: AEM_DATA_DIR
        value: .data
      - key: AEM_RECEIPT_DIR
        value: .data/receipts
      - key: AEM_DRAFT_DIR
        value: .data/brouillons
      - key: AEM_DRAFTS
        value: "1"
      - key: AEM_MAIL_ATTACHMENTS
        value: "0"
      - key: AEM_CANDIDATE_MAIL
        value: "0"
      - key: AEM_RETENTION_DAYS
        value: "60"
      # Messagerie : sur Render Free, configurer Resend (HTTPS), pas SMTP.
      # AEM_EMAIL_PROVIDER=resend + RESEND_API_KEY + AEM_FROM (domaine vérifié) + AEM_RECIPIENT
      - key: AEM_EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AEM_FROM
        sync: false
      - key: AEM_RECIPIENT
        sync: false
      - key: AEM_ADMIN_URL
        sync: false
      # Saisir manuellement : demo:demo:responsable
      - key: AEM_ADMIN_ACCOUNTS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
